name: tests

# The suite is offline: no target, no network, no PHP, and nothing to install
# first. The one test that needs `cryptography` skips itself when it is absent,
# so this runs on a bare interpreter.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the unit tests
        run: python -m unittest discover -s tests -t . -v
