[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "injectorkit"
version = "0.1.3"
description = "Exploitation toolkit for CTF and authorized penetration testing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "coolmoon" },
    { name = "guaidao2" },
]
keywords = ["security", "pentest", "exploitation", "ssrf", "ctf", "offensive-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["cryptography>=3.4"]

[project.urls]
Homepage = "https://github.com/guaidao2/injectorkit"
Source = "https://github.com/guaidao2/injectorkit"

[project.scripts]
injectorkit = "injectorkit.cli:main"

[tool.setuptools.packages.find]
include = ["injectorkit*"]
